server:
  port: 8080

spring:
  application:
    name: heat-network-service

  datasource:
    url: jdbc:postgresql://localhost:5432/heat_network
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect

logging:
  level:
    root: INFO
    ru.hackathon: INFO
    ru.hackathon.heatnetworkservice.geometry.ObstacleChecker: WARN
    ru.hackathon.heatnetworkservice.geometry.GraphBuilder: INFO

routing:
  max-edge-length-min: 2000.0
  network-split-step: 5.0
  network-radius-start: 100.0
  network-radius-multiplier: 2.0
  max-radius-iterations: 10
  no-progress-iterations-to-stop: 2
  target-obstacle-radius: 500.0
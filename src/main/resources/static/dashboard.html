<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heat Network Service</title>
    <link rel="icon" href="data:,">
    <style>
        :root {
            --primary: #1f6feb;
            --primary-dark: #0d47a1;
            --primary-light: #e7f0fe;
            --bg: #f6f8fa;
            --card: #ffffff;
            --border: #d0d7de;
            --text: #1f2328;
            --muted: #656d76;
            --success: #2da44e;
            --success-light: #e6f6ea;
            --danger: #cf222e;
            --danger-light: #fdecee;
            --warning: #bf8700;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.12);
            --radius: 12px;
            --radius-sm: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* ================= Header ================= */
        header {
            background: linear-gradient(135deg, #1f6feb 0%, #0d47a1 100%);
            color: #fff;
            padding: 28px 40px;
            box-shadow: var(--shadow-md);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .brand-icon svg {
            width: 26px;
            height: 26px;
            stroke: #fff;
        }

        .brand h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.2px;
            margin-bottom: 2px;
        }

        .brand p {
            font-size: 13px;
            opacity: 0.8;
        }

        header nav {
            display: flex;
            gap: 8px;
        }

        header nav a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            padding: 9px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        header nav a:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.45);
            transform: translateY(-1px);
        }

        /* ================= Main ================= */
        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px 40px 80px;
        }

        /* ================= Toolbar ================= */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
            flex-wrap: wrap;
            padding: 16px 20px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 220px;
            max-width: 360px;
        }

        .search-box svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            stroke: var(--muted);
            pointer-events: none;
        }

        .search-box input {
            width: 100%;
            padding: 10px 12px 10px 38px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: inherit;
            background: #fff;
            color: var(--text);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.12);
        }

        .status-indicator {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--muted);
            white-space: nowrap;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ================= Buttons ================= */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text);
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
            white-space: nowrap;
            user-select: none;
        }

        .btn svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .btn:hover:not(:disabled) {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-dark);
            border-color: var(--primary-dark);
            color: #fff;
        }

        .btn-danger {
            color: var(--danger);
            border-color: rgba(207, 34, 46, 0.3);
        }

        .btn-danger:hover:not(:disabled) {
            background: var(--danger-light);
            border-color: var(--danger);
            color: var(--danger);
        }

        .btn-success {
            background: var(--success);
            color: #fff;
            border-color: var(--success);
        }

        .btn-success:hover:not(:disabled) {
            background: #1f7d3a;
            border-color: #1f7d3a;
            color: #fff;
        }

        /* ================= Selection bar ================= */
        .selection-bar {
            display: none;
            align-items: center;
            gap: 16px;
            padding: 14px 20px;
            background: linear-gradient(90deg, var(--primary-light) 0%, #f0f7ff 100%);
            border: 1px solid rgba(31, 111, 235, 0.25);
            border-radius: var(--radius);
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
            animation: slideDown 0.2s ease;
        }

        .selection-bar.active {
            display: flex;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .selection-count {
            font-weight: 600;
            color: var(--primary-dark);
            font-size: 14px;
        }

        .selection-actions {
            display: flex;
            gap: 8px;
            margin-left: auto;
            flex-wrap: wrap;
        }

        /* ================= Section ================= */
        .section {
            margin-bottom: 36px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .section-header h2 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .section-icon.uploads {
            background: var(--primary-light);
        }

        .section-icon.uploads svg {
            stroke: var(--primary);
        }

        .section-icon.results {
            background: var(--success-light);
        }

        .section-icon.results svg {
            stroke: var(--success);
        }

        .section-icon svg {
            width: 18px;
            height: 18px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: var(--primary-light);
            color: var(--primary-dark);
        }

        .badge-results {
            background: var(--success-light);
            color: #1a7f37;
        }

        .section-actions {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }

        /* ================= Grid ================= */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }

        /* ================= File card ================= */
        .card {
            position: relative;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
            transition: all 0.18s ease;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            gap: 14px;
            cursor: pointer;
        }

        .card:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .card.selected {
            border-color: var(--primary);
            background: linear-gradient(180deg, #fff 0%, var(--primary-light) 100%);
            box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.12), var(--shadow-md);
        }

        .card.results:hover {
            border-color: var(--success);
        }

        .card.results.selected {
            border-color: var(--success);
            background: linear-gradient(180deg, #fff 0%, var(--success-light) 100%);
            box-shadow: 0 0 0 3px rgba(45, 164, 78, 0.12), var(--shadow-md);
        }

        .card-head {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        /* Кастомный чекбокс */
        .checkbox {
            position: relative;
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            margin-top: 2px;
        }

        .checkbox input {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            z-index: 2;
        }

        .checkbox-box {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-radius: 5px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            pointer-events: none;
        }

        .checkbox input:checked ~ .checkbox-box {
            background: var(--primary);
            border-color: var(--primary);
        }

        .card.results .checkbox input:checked ~ .checkbox-box {
            background: var(--success);
            border-color: var(--success);
        }

        .checkbox-box svg {
            width: 14px;
            height: 14px;
            stroke: #fff;
            stroke-width: 3;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.15s ease;
        }

        .checkbox input:checked ~ .checkbox-box svg {
            opacity: 1;
            transform: scale(1);
        }

        .card-icon {
            flex-shrink: 0;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card.results .card-icon {
            background: var(--success-light);
        }

        .card-icon svg {
            width: 22px;
            height: 22px;
            stroke: var(--primary);
        }

        .card.results .card-icon svg {
            stroke: var(--success);
        }

        .card-body {
            flex: 1;
            min-width: 0;
        }

        .card-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            word-break: break-all;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-meta {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 8px;
            font-size: 12px;
            color: var(--muted);
            flex-wrap: wrap;
        }

        .meta-item {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .meta-item svg {
            width: 13px;
            height: 13px;
            stroke: var(--muted);
            opacity: 0.8;
        }

        .card-actions {
            display: flex;
            gap: 8px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .card-actions .btn {
            flex: 1;
            padding: 8px 12px;
            font-size: 13px;
        }

        /* ================= Empty state ================= */
        .empty {
            grid-column: 1 / -1;
            padding: 60px 24px;
            text-align: center;
            color: var(--muted);
            background: var(--card);
            border: 2px dashed var(--border);
            border-radius: var(--radius);
        }

        .empty svg {
            width: 56px;
            height: 56px;
            opacity: 0.3;
            margin-bottom: 16px;
            stroke: var(--muted);
        }

        .empty h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 6px;
        }

        .empty p {
            font-size: 13px;
        }

        /* ================= Loading ================= */
        .loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 24px;
            color: var(--muted);
            font-size: 14px;
        }

        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(31, 111, 235, 0.15);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ================= Toast ================= */
        .toast {
            position: fixed;
            bottom: 32px;
            right: 32px;
            background: var(--text);
            color: #fff;
            padding: 14px 22px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            transform: translateY(16px) scale(0.95);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            z-index: 1000;
            max-width: 400px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .toast svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }

        /* ================= Responsive ================= */
        @media (max-width: 768px) {
            header { padding: 20px; }
            main { padding: 20px 16px 60px; }
            .header-inner { flex-direction: column; align-items: flex-start; }
            header nav { width: 100%; }
            .toolbar { padding: 14px; }
            .search-box { max-width: none; }
            .selection-bar { flex-direction: column; align-items: stretch; }
            .selection-actions { margin-left: 0; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-inner">
        <div class="brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2v6l3 3"/>
                    <circle cx="12" cy="14" r="7"/>
                </svg>
            </div>
            <div>
                <h1>Heat Network Service</h1>
                <p>Управление входными и выходными файлами</p>
            </div>
        </div>
        <nav>
            <a href="/docs-ui/index.html" target="_blank">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     style="width:14px;height:14px">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                </svg>
                API Docs
            </a>
        </nav>
    </div>
</header>

<main>

    <!-- Toolbar -->
    <div class="toolbar">
        <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" id="searchInput" placeholder="Поиск по имени файла..."
                   oninput="applyFilter()">
        </div>
        <button class="btn btn-primary" onclick="refreshAll()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"/>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
            Обновить
        </button>
        <div class="status-indicator">
            <span class="dot"></span>
            <span id="lastUpdate">обновление...</span>
        </div>
    </div>

    <!-- Selection bar -->
    <div class="selection-bar" id="selectionBar">
        <span class="selection-count" id="selectionCount">Выбрано: 0</span>
        <div class="selection-actions">
            <button class="btn btn-success" onclick="downloadSelected()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                Скачать выбранные
            </button>
            <button class="btn btn-danger" onclick="deleteSelected()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"/>
                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                    <path d="M10 11v6M14 11v6"/>
                </svg>
                Удалить выбранные
            </button>
            <button class="btn" onclick="clearSelection()">
                Снять выделение
            </button>
        </div>
    </div>

    <!-- Uploads -->
    <section class="section">
        <div class="section-header">
            <div class="section-icon uploads">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
            </div>
            <h2>
                Входные файлы
                <span class="badge" id="uploadsCount">0</span>
            </h2>
            <div class="section-actions">
                <button class="btn" onclick="selectAll('uploads')">
                    Выбрать все
                </button>
                <button class="btn btn-danger" onclick="clearDir('uploads')">
                    Очистить
                </button>
            </div>
        </div>
        <div class="grid" id="uploadsGrid">
            <div class="loading">
                <div class="spinner"></div>
                <div>Загрузка...</div>
            </div>
        </div>
    </section>

    <!-- Results -->
    <section class="section">
        <div class="section-header">
            <div class="section-icon results">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                    <polyline points="22 4 12 14.01 9 11.01"/>
                </svg>
            </div>
            <h2>
                Результаты
                <span class="badge badge-results" id="resultsCount">0</span>
            </h2>
            <div class="section-actions">
                <button class="btn" onclick="selectAll('results')">
                    Выбрать все
                </button>
                <button class="btn btn-danger" onclick="clearDir('results')">
                    Очистить
                </button>
            </div>
        </div>
        <div class="grid" id="resultsGrid">
            <div class="loading">
                <div class="spinner"></div>
                <div>Загрузка...</div>
            </div>
        </div>
    </section>

</main>

<div class="toast" id="toast"></div>

<script>
    const API = '/api/v1/files';

    // Текущее состояние
    let state = {
        uploads: [],
        results: [],
        selected: {
            uploads: new Set(),
            results: new Set()
        }
    };

    // ---------- Утилиты ----------

    function formatSize(bytes) {
        if (bytes < 1024) return bytes + ' Б';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' КБ';
        if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(2) + ' МБ';
        return (bytes / 1024 / 1024 / 1024).toFixed(2) + ' ГБ';
    }

    function formatDate(ms) {
        const d = new Date(ms);
        const now = new Date();
        const diff = now - d;
        if (diff < 60_000) return 'только что';
        if (diff < 3_600_000) return Math.floor(diff / 60_000) + ' мин назад';
        if (diff < 86_400_000) return Math.floor(diff / 3_600_000) + ' ч назад';
        return d.toLocaleString('ru-RU', {
            day: '2-digit', month: '2-digit', year: 'numeric',
            hour: '2-digit', minute: '2-digit'
        });
    }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;',
            '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    let toastTimer = null;
    function showToast(msg, type = 'success') {
        const el = document.getElementById('toast');
        const icon = type === 'error'
            ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'
            : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
        el.innerHTML = icon + '<span>' + escapeHtml(msg) + '</span>';
        el.className = 'toast show ' + type;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.className = 'toast ' + type, 3000);
    }

    // ---------- Рендер ----------

    function renderEmpty(title, text) {
        return `
            <div class="empty">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                </svg>
                <h3>${escapeHtml(title)}</h3>
                <p>${escapeHtml(text)}</p>
            </div>
        `;
    }

    function renderCard(file, type) {
        const isSelected = state.selected[type].has(file.name);
        const typeClass = type === 'results' ? 'results' : '';
        return `
            <div class="card ${typeClass} ${isSelected ? 'selected' : ''}"
                 data-name="${escapeHtml(file.name)}"
                 onclick="toggleCard('${type}', '${escapeHtml(file.name)}', event)">
                <div class="card-head">
                    <label class="checkbox" onclick="event.stopPropagation()">
                        <input type="checkbox"
                               ${isSelected ? 'checked' : ''}
                               onchange="toggleCheckbox('${type}', '${escapeHtml(file.name)}', this.checked)">
                        <span class="checkbox-box">
                            <svg viewBox="0 0 24 24" fill="none"
                                 stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="20 6 9 17 4 12"/>
                            </svg>
                        </span>
                    </label>
                    <div class="card-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                        </svg>
                    </div>
                    <div class="card-body">
                        <div class="card-name" title="${escapeHtml(file.name)}">${escapeHtml(file.name)}</div>
                    </div>
                </div>
                <div class="card-meta">
                    <span class="meta-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        ${formatSize(file.size)}
                    </span>
                    <span class="meta-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg>
                        ${formatDate(file.lastModified)}
                    </span>
                </div>
                <div class="card-actions" onclick="event.stopPropagation()">
                    <a class="btn btn-primary" href="${file.downloadUrl}">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        Скачать
                    </a>
                    <button class="btn btn-danger" onclick="deleteFile('${type}', '${escapeHtml(file.name)}')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"/>
                            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                            <path d="M10 11v6M14 11v6"/>
                        </svg>
                        Удалить
                    </button>
                </div>
            </div>
        `;
    }

    function getFilter() {
        return document.getElementById('searchInput').value.trim().toLowerCase();
    }

    function applyFilter() {
        renderSection('uploads', state.uploads);
        renderSection('results', state.results);
    }

    function renderSection(type, files) {
        const grid = document.getElementById(type + 'Grid');
        const countEl = document.getElementById(type + 'Count');
        const filter = getFilter();

        const visible = filter
            ? files.filter(f => f.name.toLowerCase().includes(filter))
            : files;

        countEl.textContent = files.length;

        if (files.length === 0) {
            grid.innerHTML = renderEmpty(
                type === 'uploads' ? 'Нет входных файлов' : 'Нет результатов',
                type === 'uploads'
                    ? 'Загрузите GeoJSON через POST /api/v1/solve'
                    : 'Результаты появятся после обработки'
            );
            return;
        }

        if (visible.length === 0) {
            grid.innerHTML = renderEmpty(
                'Ничего не найдено',
                'Попробуйте изменить поисковый запрос'
            );
            return;
        }

        grid.innerHTML = visible.map(f => renderCard(f, type)).join('');
    }

    function updateSelectionBar() {
        const total = state.selected.uploads.size + state.selected.results.size;
        const bar = document.getElementById('selectionBar');
        const count = document.getElementById('selectionCount');

        if (total > 0) {
            bar.classList.add('active');
            count.textContent = `Выбрано: ${total} ` +
                `(${state.selected.uploads.size} входных, ${state.selected.results.size} результатов)`;
        } else {
            bar.classList.remove('active');
        }
    }

    // ---------- Выбор ----------

    function toggleCard(type, name, event) {
        // Клик по карточке (не по кнопкам/чекбоксу) — переключаем выбор
        if (event.target.closest('.card-actions') ||
            event.target.closest('.checkbox')) return;
        toggleCheckbox(type, name);
    }

    function toggleCheckbox(type, name, forced) {
        const set = state.selected[type];
        const shouldSelect = forced !== undefined ? forced : !set.has(name);

        if (shouldSelect) set.add(name);
        else set.delete(name);

        // Обновляем визуально карточку
        const card = document.querySelector(
            `#${type}Grid .card[data-name="${cssEscape(name)}"]`);
        if (card) {
            card.classList.toggle('selected', shouldSelect);
            const cb = card.querySelector('input[type=checkbox]');
            if (cb) cb.checked = shouldSelect;
        }

        updateSelectionBar();
    }

    function cssEscape(s) {
        return s.replace(/(["\\])/g, '\\$1');
    }

    function selectAll(type) {
        const filter = getFilter();
        const files = state[type].filter(f =>
            !filter || f.name.toLowerCase().includes(filter));

        files.forEach(f => state.selected[type].add(f.name));
        renderSection(type, state[type]);
        updateSelectionBar();
    }

    function clearSelection() {
        state.selected.uploads.clear();
        state.selected.results.clear();
        renderSection('uploads', state.uploads);
        renderSection('results', state.results);
        updateSelectionBar();
    }

    // ---------- API ----------

    async function refreshAll() {
        try {
            const res = await fetch(API);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();

            state.uploads = data.uploads || [];
            state.results = data.results || [];

            // Чистим выделение от исчезнувших файлов
            cleanupSelection();

            renderSection('uploads', state.uploads);
            renderSection('results', state.results);
            updateSelectionBar();

            document.getElementById('lastUpdate').textContent =
                'обновлено в ' + new Date().toLocaleTimeString('ru-RU');
        } catch (e) {
            showToast('Ошибка загрузки: ' + e.message, 'error');
        }
    }

    function cleanupSelection() {
        ['uploads', 'results'].forEach(type => {
            const existing = new Set(state[type].map(f => f.name));
            const toRemove = [];
            state.selected[type].forEach(name => {
                if (!existing.has(name)) toRemove.push(name);
            });
            toRemove.forEach(n => state.selected[type].delete(n));
        });
    }

    async function deleteFile(type, name) {
        if (!confirm(`Удалить файл "${name}"?`)) return;
        try {
            const res = await fetch(
                `${API}/${type}/${encodeURIComponent(name)}`,
                { method: 'DELETE' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            state.selected[type].delete(name);
            showToast(`Файл "${name}" удалён`, 'success');
            await refreshAll();
        } catch (e) {
            showToast('Ошибка удаления: ' + e.message, 'error');
        }
    }

    async function deleteSelected() {
        const total = state.selected.uploads.size + state.selected.results.size;
        if (total === 0) return;
        if (!confirm(`Удалить выбранные файлы (${total} шт.)?`)) return;

        const errors = [];
        for (const type of ['uploads', 'results']) {
            for (const name of Array.from(state.selected[type])) {
                try {
                    const res = await fetch(
                        `${API}/${type}/${encodeURIComponent(name)}`,
                        { method: 'DELETE' });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    state.selected[type].delete(name);
                } catch (e) {
                    errors.push(`${name}: ${e.message}`);
                }
            }
        }

        if (errors.length > 0) {
            showToast(`Ошибок: ${errors.length}`, 'error');
        } else {
            showToast(`Удалено файлов: ${total}`, 'success');
        }
        await refreshAll();
    }

    function downloadSelected() {
        const all = [];
        state.selected.uploads.forEach(n => {
            const f = state.uploads.find(x => x.name === n);
            if (f) all.push(f);
        });
        state.selected.results.forEach(n => {
            const f = state.results.find(x => x.name === n);
            if (f) all.push(f);
        });

        if (all.length === 0) return;

        // Последовательно инициируем скачивание с небольшой задержкой
        all.forEach((file, i) => {
            setTimeout(() => {
                const a = document.createElement('a');
                a.href = file.downloadUrl;
                a.download = file.name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }, i * 200);
        });

        showToast(`Скачивание ${all.length} файлов...`, 'success');
    }

    async function clearDir(type) {
        const count = state[type].length;
        if (count === 0) {
            showToast('В этом разделе нет файлов', 'error');
            return;
        }
        if (!confirm(`Удалить ВСЕ файлы из "${type}" (${count} шт.)?`)) return;
        try {
            const res = await fetch(`${API}/${type}`, { method: 'DELETE' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            state.selected[type].clear();
            showToast(`Удалено файлов: ${data.deleted}`, 'success');
            await refreshAll();
        } catch (e) {
            showToast('Ошибка очистки: ' + e.message, 'error');
        }
    }

    // ---------- Автозагрузка ----------

    refreshAll();
    setInterval(refreshAll, 10000);
</script>

</body>
</html>

version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: heat-network-db
    environment:
      POSTGRES_DB: heat_network
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d heat_network"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: